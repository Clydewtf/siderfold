[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siderfold-backend"
version = "0.9.0"
description = "Siderfold backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "lxml>=5.3,<7",
  "pypdf>=5.0,<7",
  "pydantic>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1"
]

[project.scripts]
siderfold-import = "app.import_bridge.cli:main"
siderfold-sources = "app.sources.cli:main"
siderfold-analytics = "app.analytics.cli:main"

[project.optional-dependencies]
test = [
  "httpx2>=2.1,<3",
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "postgres: requires TEST_DATABASE_URL for an isolated PostgreSQL database"
]

[tool.setuptools.packages.find]
include = ["app*"]
