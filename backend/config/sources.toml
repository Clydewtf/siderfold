version = 1

[sources.fixture-catalog]
source_key = "fixture-catalog"
name = "Siderfold demonstration catalog"
canonical_url = "https://fixture.siderfold.test/catalog"
allowed_url_prefixes = ["https://fixture.siderfold.test/catalog"]
access_method = "fixture"
schedule = "manual"
status = "active"
responsible = "siderfold-data"
adapter_name = "fixture-catalog"
adapter_version = "1.0.0"
fixture_path = "tests/fixtures/adapters/catalog_v1.json"
secret_env_vars = []

[sources.fixture-catalog.limits]
max_requests = 1
max_response_bytes = 100000
max_total_bytes = 100000
max_records = 100
timeout_seconds = 5
min_run_interval_seconds = 0

[sources.potanin-competitions]
source_key = "potanin-competitions"
name = "Фонд Потанина: конкурсы"
canonical_url = "https://fondpotanin.ru/competitions/"
allowed_url_prefixes = [
  "https://fondpotanin.ru/competitions",
  "https://fondpotanin.ru/upload",
  "https://fondpotanin.ru/press",
]
allowed_exact_urls = ["https://fondpotanin.ru/sitemap-iblock-competitions.xml"]
access_method = "http"
schedule = "manual"
status = "active"
responsible = "siderfold-data"
adapter_name = "potanin-competitions"
adapter_version = "1.4.0"
secret_env_vars = []

[sources.potanin-competitions.limits]
max_requests = 320
max_response_bytes = 8000000
max_total_bytes = 200000000
max_records = 200
timeout_seconds = 45
max_run_seconds = 1800
min_run_interval_seconds = 300

[sources.telegram-cptgrantov-discovery]
source_key = "telegram-cptgrantov-discovery"
name = "Центр поддержки технологий и грантов: discovery"
canonical_url = "https://t.me/cptgrantov"
allowed_url_prefixes = ["https://t.me/s/cptgrantov"]
access_method = "http"
schedule = "manual"
status = "active"
responsible = "siderfold-data"
adapter_name = "telegram-discovery"
adapter_version = "1.0.0"
secret_env_vars = []

[sources.telegram-cptgrantov-discovery.limits]
max_requests = 60
max_response_bytes = 1000000
max_total_bytes = 30000000
max_records = 10000
timeout_seconds = 20
min_run_interval_seconds = 300

[sources.telegram-cptgrantov-discovery.telegram_channel]
channel_handle = "cptgrantov"
public_read_url = "https://t.me/s/cptgrantov"
retention_days = 90
min_request_interval_seconds = 2
max_messages_per_run = 10000
